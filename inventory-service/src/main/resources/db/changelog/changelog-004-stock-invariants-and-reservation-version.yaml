databaseChangeLog:

  # ===========================================================================
  #  004-stock-invariants-and-reservation-version
  # ---------------------------------------------------------------------------
  #  F-010 — the inventory counters carried no storage-level invariant, so a
  #  read-modify-write race could leave available_quantity / reserved_quantity
  #  negative and silently defeat the (available - reserved) >= qty capacity
  #  guard that prevents overselling. The CHECK constraints are the last line
  #  of defence; the application clamps the same arithmetic.
  #
  #  F-011 — the reservations table had no version column, so the expiry sweep
  #  (an unlocked SELECT followed by a blind save) could overwrite a COMMITTED
  #  reservation with EXPIRED. The version column gives the reservation
  #  aggregate optimistic locking, and the sweep now claims a row with a
  #  conditional UPDATE so exactly one writer can transition it.
  #
  #  Rolling-deployment safety:
  #    * the version column is added with DEFAULT 0 NOT NULL — an additive,
  #      backward-compatible change; old code ignores the column, new code
  #      reads 0 for pre-existing rows.
  #    * the CHECK constraints are added NOT VALID. NOT VALID means the
  #      constraint is enforced for NEW and updated rows while existing rows
  #      are not scanned, so adding it neither locks the table nor fails on a
  #      legacy row that already violates it. A follow-up VALIDATE CONSTRAINT
  #      completes the check once pre-existing rows have been repaired.
  # ===========================================================================
  - changeSet:
      id: 004-stock-invariants-and-reservation-version
      author: production-audit
      changes:
        - addColumn:
            tableName: reservations
            columns:
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE inventory
                ADD CONSTRAINT ck_inventory_available_non_negative
                CHECK (available_quantity >= 0) NOT VALID;

        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE inventory
                ADD CONSTRAINT ck_inventory_reserved_non_negative
                CHECK (reserved_quantity >= 0) NOT VALID;
