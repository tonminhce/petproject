spring:
  config:
    import: "classpath:/application-shared.yml"
  application:
    name: inventory-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventoryservice}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  cache:
    type: redis
    redis:
      time-to-live: 60000
      cache-null-values: false
      use-key-prefix: true

server:
  port: ${SERVER_PORT:8082}

shop:
  kafka:
    bootstrap-servers: ${SHOP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
  security:
    public-paths: []

inventory:
  reservation-ttl-seconds: 900
  reservation-cleanup-interval-ms: 60000
  reservation-cleanup-batch-size: 500
  reservation-retention-cron: "0 0 4 * * *"
  outbox:
    poll-interval-ms: 5000
    batch-size: 100
    max-retries: 10
    retention-cron: "0 0 3 * * *"
