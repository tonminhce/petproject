# =============================================================================
#  inventory-service — Stock management + reservation lifecycle.
#  Reads/writes Postgres, caches hot reads in Redis (cache-aside TTL 60s),
#  publishes stock events to Kafka through a transactional outbox.
#
#  Platform-wide defaults live in common-spring/application.yml (inherited).
#  Only service-specific overrides belong here.
# =============================================================================
spring:
  application:
    name: inventory-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventoryservice}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema is owned by Liquibase — never let Hibernate mutate it.
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Empty means "no AUTH" — the compose Redis runs with --requirepass.
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  cache:
    type: redis
    redis:
      # Defensive fallback for any cache NOT registered by CacheConfig — the
      # CacheConfig bean is the single source of truth for the "inventory"
      # cache (entryTtl 60s, JSON serializer, disableCachingNullValues).
      time-to-live: 60000           # 60s — matches CacheConfig.INVENTORY_TTL
      cache-null-values: false
      use-key-prefix: true

server:
  # Override the common-spring default 8080 (compose maps 8082:8082).
  # (shutdown: graceful is inherited from common-spring/application.yml.)
  port: ${SERVER_PORT:8082}

shop:
  kafka:
    # common-kafka binds shop.kafka.* (KafkaProperties) — NOT spring.kafka.*.
    bootstrap-servers: ${SHOP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Durability over throughput: the outbox relay must not lose events.
      acks: all
      retries: 3
  security:
    # Every endpoint requires a valid JWT — stock levels are business-sensitive.
    # Reads: authenticated (USER/ADMIN). Writes: ADMIN. Reservations: SERVICE/ADMIN
    # (method-level @PreAuthorize on InventoryController; empty public-paths here,
    # matching favourite-service).
    # (actuator, swagger, api-docs are public via common-security platform defaults)
    public-paths: []

inventory:
  reservation-ttl-seconds: 900          # 15 min
  # Scheduled jobs — values MUST match the inline @Value/@Scheduled defaults in
  # ReservationCleanupScheduler / OutboxRetentionScheduler. Declared explicitly
  # (spec §7.1) so ops can see what runs when without grepping Java sources.
  reservation-cleanup-interval-ms: 60000      # expired sweep every 60s
  reservation-cleanup-batch-size: 500         # sweep in batches (memory guard)
  reservation-retention-cron: "0 0 4 * * *"   # purge EXPIRED > 30 days, 04:00 daily
  outbox:
    poll-interval-ms: 5000
    batch-size: 100
    max-retries: 10
    retention-cron: "0 0 3 * * *"             # purge SENT > 7 days, 03:00 daily
