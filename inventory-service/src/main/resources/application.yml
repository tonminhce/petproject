spring:
  application:
    name: inventory-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventoryservice}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  cache:
    type: redis
    redis:
      time-to-live: 60000           # 60s — matches CacheConfig.INVENTORY_TTL
      cache-null-values: false
      use-key-prefix: true

server:
  port: ${SERVER_PORT:8082}

shop:
  kafka:
    bootstrap-servers: ${SHOP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
  security:
    public-paths: []

inventory:
  reservation-ttl-seconds: 900          # 15 min
  reservation-cleanup-interval-ms: 60000      # expired sweep every 60s
  reservation-cleanup-batch-size: 500         # sweep in batches (memory guard)
  reservation-retention-cron: "0 0 4 * * *"   # purge EXPIRED > 30 days, 04:00 daily
  outbox:
    poll-interval-ms: 5000
    batch-size: 100
    max-retries: 10
    retention-cron: "0 0 3 * * *"             # purge SENT > 7 days, 03:00 daily
