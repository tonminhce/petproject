spring:
  application:
    name: order-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderservice}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  cache:
    type: redis

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

shop:
  kafka:
    bootstrap-servers: ${SHOP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer: { acks: all, retries: 3 }
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
  security:
    public-paths:
      - path: /api/v1/carts/**
      - path: /api/v1/orders/track

  services:
    product:
      url: ${PRODUCT_SERVICE_URL:http://localhost:8086}
      timeout-ms: 5000
    inventory:
      url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
      timeout-ms: 5000
    tax:
      url: ${TAX_SERVICE_URL:http://localhost:8091}
      timeout-ms: 3000
      enabled: ${TAX_SERVICE_ENABLED:false}
    promotion:
      url: ${PROMOTION_SERVICE_URL:http://localhost:8093}
      timeout-ms: 3000
      enabled: ${PROMOTION_SERVICE_ENABLED:false}
    payment:
      url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
      timeout-ms: 3000
      enabled: ${PAYMENT_SERVICE_ENABLED:true}
    keycloak:
      token-url: ${KEYCLOAK_TOKEN_URL:http://localhost:8080/realms/ecommerce/protocol/openid-connect/token}
      client-id: ${ORDER_SERVICE_CLIENT_ID:order-service}
      client-secret: ${ORDER_SERVICE_CLIENT_SECRET:}

order:
  idempotency:
    ttl-hours: 24
  outbox:
    poll-interval-ms: 5000
    batch-size: 100
    max-retries: 10
    retention-days: 7
    retention-cron: "0 0 3 * * *"
  cleanup:
    idempotency-cron: "0 0 4 * * *"
    expired-cart-days: 7
    cancelled-order-days: 90
  reconciliation:
    interval-ms: ${ORDER_RECONCILIATION_INTERVAL_MS:300000}
    stuck-minutes: ${ORDER_RECONCILIATION_STUCK_MINUTES:30}
  compensation:
    retry-millis: ${ORDER_COMPENSATION_RETRY_MILLIS:30000}
    retry-backoff-seconds: ${ORDER_COMPENSATION_RETRY_BACKOFF_SECONDS:60}
    claim-lease-seconds: ${ORDER_COMPENSATION_CLAIM_LEASE_SECONDS:120}
    max-attempts: ${ORDER_COMPENSATION_MAX_ATTEMPTS:5}
    batch-size: ${ORDER_COMPENSATION_BATCH_SIZE:50}
