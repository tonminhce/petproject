databaseChangeLog:
  - changeSet:
      id: 009-order-tracking-code
      author: shop-platform
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: tracking_code
                  type: UUID
              - column:
                  name: track_failures
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: track_locked_until
                  type: TIMESTAMP
        - createIndex:
            tableName: orders
            indexName: idx_orders_tracking_code
            unique: true
            columns:
              - column: { name: tracking_code }
