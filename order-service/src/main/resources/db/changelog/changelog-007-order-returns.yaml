databaseChangeLog:
  - changeSet:
      id: 007-create-order-returns
      author: antigravity
      changes:
        - createTable:
            tableName: order_returns
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_returns_order
                    references: orders(id)
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(32)
                  defaultValue: REQUESTED
                  constraints:
                    nullable: false
              - column:
                  name: refund_amount
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: admin_notes
                  type: TEXT
              - column:
                  name: reviewed_by
                  type: VARCHAR(64)
              - column:
                  name: reviewed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_by
                  type: VARCHAR(64)
        - createIndex:
            indexName: idx_order_returns_order_id
            tableName: order_returns
            columns:
              - column:
                  name: order_id
        - createIndex:
            indexName: idx_order_returns_user_id
            tableName: order_returns
            columns:
              - column:
                  name: user_id
