spring:
  application:
    name: promotion-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/promotionservice}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8093}

shop:
  kafka:
    bootstrap-servers: ${SHOP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
  security:
    csrf-disabled: true

  promotion:
    reservation-ttl-seconds: 900
    reservation-cleanup-batch-size: 500
    reservation-cleanup-interval-ms: 60000
    reservation-retention-cron: "0 0 4 * * *"
    reservation-retention-days: 30

promotion:
  outbox:
    poll-interval-ms: 5000
    batch-size: 100
    max-retries: 10
    retention-cron: "0 0 3 * * *"
