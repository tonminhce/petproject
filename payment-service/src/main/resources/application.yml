spring:
  application:
    name: payment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paymentservice}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8085}

shop:
  kafka:
    bootstrap-servers: ${SHOP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # A13: payment-service has no consumer today, but pin group + offset to the
      # fleet-safe defaults now so any future listener doesn't fall back to the
      # common `shop-service` / `earliest` defaults (silent data loss + replay).
      group-id: ${SHOP_KAFKA_CONSUMER_GROUP:payment-service}
      auto-offset-reset: latest

  # common-storage auto-config creates the S3 client + ensures the bucket at
  # startup; point it at RustFS in compose (see docker-compose payment stanza).
  # Key defaults mirror StorageProperties so no-env local runs still boot.
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:rustfsadmin}
    secret-key: ${STORAGE_SECRET_KEY:rustfsadmin}
    bucket: ${STORAGE_BUCKET:shop-payments}

  payment:
    # A12: default to stripe (real provider) — MockProvider used to be
    # matchIfMissing=true so an unset env var silently captured payments without
    # charging. Dev compose must now inject PAYMENT_PROVIDER=mock explicitly.
    provider: ${PAYMENT_PROVIDER:stripe}
    webhook:
      # C3/C10 — fail-fast: a blank webhook secret means every legitimate
      # carrier webhook would 401. Compose must inject this var from secrets.
      secret: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET must be set}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY must be set}

  security:
    issuer-uri: ${SHOP_SECURITY_ISSUER_URI:http://localhost:9090/realms/ecommerce}
    csrf-disabled: true
    stateless-session: true
    public-paths:
      - method: POST
        path: /api/v1/webhooks/payments/**
