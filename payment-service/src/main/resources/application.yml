spring:
  config:
    import: "classpath:/application-shared.yml"
  application:
    name: payment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paymentservice}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8085}

shop:
  kafka:
    bootstrap-servers: ${SHOP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SHOP_KAFKA_CONSUMER_GROUP:payment-service}
      auto-offset-reset: earliest

  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:shop-payments}

  payment:
    provider: ${SHOP_PAYMENT_PROVIDER:stripe}
    production-mode: ${SHOP_PAYMENT_PRODUCTION_MODE:false}
    webhook:
      secret: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET must be set}
    stripe:
      secret-key: ${SHOP_PAYMENT_STRIPE_SECRET_KEY:}
      webhook-secret: ${SHOP_PAYMENT_STRIPE_WEBHOOK_SECRET:}
      api-version: "2024-06-20"
      api-base: ${SHOP_PAYMENT_STRIPE_API_BASE:}
      connect: false
      sandbox: ${SHOP_PAYMENT_STRIPE_SANDBOX:true}
      auto-confirm-sandbox: ${SHOP_PAYMENT_STRIPE_AUTO_CONFIRM_SANDBOX:true}
      sandbox-payment-method: ${SHOP_PAYMENT_STRIPE_SANDBOX_PAYMENT_METHOD:pm_card_visa}
      return-url: ${SHOP_PAYMENT_STRIPE_RETURN_URL:https://shop.example.com/checkout/complete}
      allow-redirects: ${SHOP_PAYMENT_STRIPE_ALLOW_REDIRECTS:true}
    momo:
      enabled: ${SHOP_PAYMENT_MOMO_ENABLED:false}
      base-url: ${SHOP_PAYMENT_MOMO_BASE_URL:}
      partner-code: ${SHOP_PAYMENT_MOMO_PARTNER_CODE:}
      access-key: ${SHOP_PAYMENT_MOMO_ACCESS_KEY:}
      secret-key: ${SHOP_PAYMENT_MOMO_SECRET_KEY:}
      return-url: ${SHOP_PAYMENT_MOMO_RETURN_URL:}
      notify-url: ${SHOP_PAYMENT_MOMO_NOTIFY_URL:}
      order-info: ${SHOP_PAYMENT_MOMO_ORDER_INFO:Payment}
      timeout-ms: ${SHOP_PAYMENT_MOMO_TIMEOUT_MS:30000}
    vnpay:
      enabled: ${SHOP_PAYMENT_VNPAY_ENABLED:false}
      payment-url: ${SHOP_PAYMENT_VNPAY_PAYMENT_URL:}
      api-url: ${SHOP_PAYMENT_VNPAY_API_URL:}
      tmn-code: ${SHOP_PAYMENT_VNPAY_TMN_CODE:}
      hash-secret: ${SHOP_PAYMENT_VNPAY_HASH_SECRET:}
      return-url: ${SHOP_PAYMENT_VNPAY_RETURN_URL:}
      notify-url: ${SHOP_PAYMENT_VNPAY_NOTIFY_URL:}
      bank-code: ${SHOP_PAYMENT_VNPAY_BANK_CODE:}
      order-info: ${SHOP_PAYMENT_VNPAY_ORDER_INFO:Payment}
      ip-address: ${SHOP_PAYMENT_VNPAY_IP_ADDRESS:127.0.0.1}
      user-name: ${SHOP_PAYMENT_VNPAY_USER_NAME:}
      refund-type: ${SHOP_PAYMENT_VNPAY_REFUND_TYPE:partial}
      transaction-date: ${SHOP_PAYMENT_VNPAY_TRANSACTION_DATE:}
      timeout-ms: ${SHOP_PAYMENT_VNPAY_TIMEOUT_MS:30000}

  security:
    issuer-uri: ${SHOP_SECURITY_ISSUER_URI:http://localhost:9090/realms/ecommerce}
    csrf-disabled: true
    stateless-session: true
    public-paths:
      - method: POST
        path: /api/v1/webhooks/payments/**
      - method: GET
        path: /api/v1/webhooks/payments/vnpay/ipn
