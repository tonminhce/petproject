databaseChangeLog:
  - changeSet:
      id: 003-webhook-retry-fields
      author: shop-platform
      changes:
        - addColumn:
            tableName: payment_events
            columns:
              - column:
                  name: retry_count
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: next_retry_at
                  type: timestamp
              - column:
                  name: last_error
                  type: varchar(1024)
        - sql:
            sql: >-
              UPDATE payment_events
              SET status = 'FAILED_RETRYABLE',
                  next_retry_at = NOW()
              WHERE status = 'FAILED'
