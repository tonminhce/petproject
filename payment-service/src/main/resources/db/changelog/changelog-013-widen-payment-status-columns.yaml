databaseChangeLog:

  - changeSet:
      id: 013-widen-payment-status-columns
      author: production-audit
      changes:
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE payments ALTER COLUMN status TYPE varchar(32);

        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE payments ALTER COLUMN previous_status TYPE varchar(32);

        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE payment_events ALTER COLUMN status TYPE varchar(32);
