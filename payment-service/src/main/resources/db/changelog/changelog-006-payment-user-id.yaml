databaseChangeLog:


  - changeSet:
      id: 006-payment-user-id
      author: shop-platform
      changes:
        - addColumn:
            tableName: payments
            columns:
              - column:
                  name: user_id
                  type: uuid

        - createIndex:
            tableName: payments
            indexName: idx_payments_user_idempotency
            columns:
              - column: { name: user_id }
              - column: { name: idempotency_key }
