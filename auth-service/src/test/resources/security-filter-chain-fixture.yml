# =============================================================================
#  Test-only fixture for SecurityFilterChainIntegrationTest.
#  Merged on top of src/main/resources/application.yml via
#  @TestPropertySource(properties = "spring.config.import=classpath:security-filter-chain-fixture.yml").
#
#  Spring Boot's @ConfigurationProperties list binding replaces the entire
#  List<EndpointRule> on import (it does NOT merge lists), so this file must
#  hold the COMPLETE public-paths list this test class needs, not just the
#  test-only rule. The /api/v1/auth/** entry below is a verbatim copy of the
#  production rule (it is duplicated here on purpose); if production ever
#  changes the auth public-paths rule, S2/S3 will fail and force this fixture
#  to be updated in lockstep — that is the desired fail-fast behavior.
#
#  The method-scoped GET rule on /api/v1/users/me is what this fixture exists
#  to provide: it exercises the `if (rule.method() != null)` branch in
#  BaseSecurityConfig (scenario S8 expects 403 — chain permits, controller's
#  @PreAuthorize rejects). This rule MUST NOT live in production yml: if
#  @PreAuthorize is ever removed from UserController.getCurrentUser(),
#  anonymous GET would silently start returning 200 with no test catching it.
# =============================================================================
shop:
  security:
    public-paths:
      - path: /api/v1/auth/**
      - method: GET
        path: /api/v1/users/me
