databaseChangeLog:
  - changeSet:
      id: 004-password-reset-and-addresses
      author: shop-platform
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_password_reset_user
                    references: users(user_id)
              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: used
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: password_reset_tokens
            indexName: idx_pwd_reset_token_hash
            columns:
              - column:
                  name: token_hash
        - createTable:
            tableName: user_addresses
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_address_user
                    references: users(user_id)
              - column:
                  name: recipient_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: phone_number
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: province
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: district
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: ward
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: detail_address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: is_default
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: user_addresses
            indexName: idx_user_address_user_id
            columns:
              - column:
                  name: user_id
