databaseChangeLog:
  - changeSet:
      id: 005-password-reset-token-version
      author: shop-platform
      changes:
        # F-053: the reset token carried only a 'used' flag, so two concurrent
        # redemptions both passed the used = false read. The version column
        # mirrors the optimistic lock of F-011 (reservation) and F-044 (coupon).
        - addColumn:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
