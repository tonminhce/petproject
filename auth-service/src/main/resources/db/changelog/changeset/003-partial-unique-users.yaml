databaseChangeLog:
  - changeSet:
      id: 003-partial-unique-users
      author: shop-platform
      changes:
        - dropUniqueConstraint:
            tableName: users
            constraintName: users_user_name_key
        - dropUniqueConstraint:
            tableName: users
            constraintName: users_email_key
        - dropUniqueConstraint:
            tableName: users
            constraintName: users_phone_number_key


        - createIndex:
            tableName: users
            indexName: unique_username_active
            columns:
              - column:
                  name: user_name
            where: deleted = false
            unique: true
        - createIndex:
            tableName: users
            indexName: unique_email_active
            columns:
              - column:
                  name: email
            where: deleted = false
            unique: true
        - createIndex:
            tableName: users
            indexName: unique_phone_active
            columns:
              - column:
                  name: phone_number
            where: deleted = false
            unique: true
