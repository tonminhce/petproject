databaseChangeLog:
  # Liquibase 5.0+ ignores `relativeToChangelogFile: true` — use absolute paths
  # from the classpath root so the include resolver finds the changeset files.
  - include:
      file: db/changelog/changeset/001-create-users-and-roles.yaml
  - include:
      file: db/changelog/changeset/002-add-soft-delete.yaml
  - include:
      file: db/changelog/changeset/003-partial-unique-users.yaml
  - include:
      file: db/changelog/changeset/004-password-reset-and-addresses.yaml
