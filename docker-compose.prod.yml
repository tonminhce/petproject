
x-audit-env: &audit-env
  AUDIT_LOG_PATH: /var/log/audit/audit.jsonl

x-audit-volume: &audit-volume
  volumes:
    - audit_logs:/var/log/audit

services:

  gateway-service:
    ports: !override
      - "${GATEWAY_INGRESS_PORT:-8080}:8080"
    environment:
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:?ADMIN_IP_ALLOWLIST must be set in production}
      GATEWAY_REQUIRE_ADMIN_IP_ALLOWLIST: "true"
      GATEWAY_TRUSTED_PROXY_CIDRS: ${GATEWAY_TRUSTED_PROXY_CIDRS:?GATEWAY_TRUSTED_PROXY_CIDRS must list the ingress proxy ranges in production}
      GATEWAY_TRUSTED_PROXY_HOPS: ${GATEWAY_TRUSTED_PROXY_HOPS:?GATEWAY_TRUSTED_PROXY_HOPS must be set in production}
      GATEWAY_RATE_LIMIT_OUTAGE_POLICY: ${GATEWAY_RATE_LIMIT_OUTAGE_POLICY:-FAIL_CLOSED}

  postgres:
    ports: !override []

  redis:
    ports: !override []

  kafka:
    ports: !override []

  elasticsearch:
    ports: !override []

  rustfs:
    ports: !override []

  keycloak:
    ports: !override []
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      ADMIN_SERVICE_CLIENT_SECRET: ${ADMIN_SERVICE_CLIENT_SECRET}
      KEYCLOAK_ADMIN_USER_PASSWORD: ${KEYCLOAK_ADMIN_USER_PASSWORD}

  auth-service:
    ports: !override []
    environment:
      SHOP_KEYCLOAK_ADMIN_CLIENT_SECRET: ${ADMIN_SERVICE_CLIENT_SECRET}

  product-service:
    <<: *audit-volume
    ports: !override []
    environment:
      <<: *audit-env
      PRODUCT_SERVICE_CLIENT_SECRET: ${PRODUCT_SERVICE_CLIENT_SECRET:-}

  order-service:
    ports: !override []
    environment:
      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET:-}

  payment-service:
    <<: *audit-volume
    ports: !override []
    environment:
      <<: *audit-env

  shipping-service:
    <<: *audit-volume
    ports: !override []
    environment:
      <<: *audit-env

  inventory-service:
    <<: *audit-volume
    ports: !override []
    environment:
      <<: *audit-env

  favourite-service:
    ports: !override []

  media-service:
    <<: *audit-volume
    ports: !override []
    environment:
      <<: *audit-env
      MEDIA_SERVICE_CLIENT_SECRET: ${MEDIA_SERVICE_CLIENT_SECRET:-}

  tax-service:
    <<: *audit-volume
    ports: !override []
    environment:
      <<: *audit-env

  promotion-service:
    <<: *audit-volume
    ports: !override []
    environment:
      <<: *audit-env

  rating-service:
    <<: *audit-volume
    ports: !override []
    environment:
      <<: *audit-env
      RATING_SERVICE_CLIENT_SECRET: ${RATING_SERVICE_CLIENT_SECRET:-}

  search-service:
    <<: *audit-volume
    ports: !override []
    environment:
      <<: *audit-env
      SEARCH_SERVICE_CLIENT_SECRET: ${SEARCH_SERVICE_CLIENT_SECRET:-}

  notification-service:
    <<: *audit-volume
    ports: !override []
    environment:
      <<: *audit-env

volumes:
  audit_logs:
