
spring:
  application:
    name: shop-service

  profiles:
    active: dev

  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:false}

  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT_MS:5000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD_MS:10000}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      access: read_only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.shop: INFO
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "

shop:
  web:
    correlation:
      enabled: ${WEB_CORRELATION_ENABLED:true}
    logging:
      request:
        enabled: ${WEB_LOG_REQUEST_ENABLED:false}
        include-body: false
        max-body-bytes: 4096
      response:
        enabled: ${WEB_LOG_RESPONSE_ENABLED:false}
        include-body: false
        max-body-bytes: 4096
      performance:
        enabled: ${PERF_LOG_ENABLED:true}
        threshold-ms: ${PERF_LOG_THRESHOLD_MS:50}
    exception-handler:
      enabled: ${WEB_EXCEPTION_HANDLER_ENABLED:true}
  i18n:
    default-locale: ${I18N_DEFAULT_LOCALE:vi}
    fallback-to-system-locale: true
    use-code-as-default-message: false
    encoding: UTF-8
    cache-duration: 5m
    basenames:
      - classpath:messages/messages
  security:
    issuer-uri: ${JWT_ISSUER_URI:http://keycloak:8080/realms/ecommerce}
    csrf-disabled: true
    stateless-session: true
    expected-client-ids: ${SHOP_SECURITY_EXPECTED_CLIENT_IDS:ecommerce-client,order-service,rating-service,search-service,product-service,media-service}
    expected-audiences: ${SHOP_SECURITY_EXPECTED_AUDIENCES:}
    cors:
      enabled: ${ECOMMERCE_CORS_ENABLED:true}
      allowed-origin-patterns:
        - ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173}
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: false
      max-age-seconds: 3600
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://keycloak:8080}
    public-server-url: ${KEYCLOAK_PUBLIC_SERVER_URL:http://localhost:9090}
    realm: ${KEYCLOAK_REALM:ecommerce}
    client-id: ${KEYCLOAK_CLIENT_ID:ecommerce-client}
    admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    admin-client-secret: ${ADMIN_SERVICE_CLIENT_SECRET:}
    admin-username: ${KEYCLOAK_ADMIN_USERNAME:}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:}
  common:
    service:
      name: shop-service
      description: ${SERVICE_DESCRIPTION:Shop microservice}
      version: ${SERVICE_VERSION:1.0.0}
    security:
      enabled: true
    keycloak:
      enabled: true
    logging:
      correlation-id: true
      level: INFO
      performance-threshold-ms: 50
    kafka:
      enabled: false
    storage:
      enabled: false
    defaults:
      server-port: ${SERVER_PORT:8080}
      shutdown-grace-period: 30s
      max-http-header-size: 8192

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 10s
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
        cancel-running-future: true
