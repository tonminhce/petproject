apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-connect
  namespace: shop-system
  labels:
    app.kubernetes.io/name: debezium-connect
    app.kubernetes.io/part-of: shop-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: debezium-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: debezium-connect
    spec:
      containers:
        - name: debezium-connect
          image: quay.io/debezium/connect:2.7.3.Final
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: BOOTSTRAP_SERVERS
              value: "kafka.shop-system.svc.cluster.local:9092"
            - name: GROUP_ID
              value: "debezium-outbox-connect-cluster"
            - name: CONFIG_STORAGE_TOPIC
              value: "connect-configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "connect-offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "connect-status"
            - name: KEY_CONVERTER
              value: "org.apache.kafka.connect.storage.StringConverter"
            - name: VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: debezium-connect
  namespace: shop-system
  labels:
    app.kubernetes.io/name: debezium-connect
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8083
      targetPort: 8083
  selector:
    app.kubernetes.io/name: debezium-connect
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-outbox-connector-configs
  namespace: shop-system
data:
  order-outbox-connector.json: |
    {
      "name": "order-outbox-connector",
      "config": {
        "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
        "tasks.max": "1",
        "plugin.name": "pgoutput",
        "database.hostname": "postgres.shop-system.svc.cluster.local",
        "database.port": "5432",
        "database.user": "postgres",
        "database.password": "${file:/secrets/db:postgres_password}",
        "database.dbname": "orderservice",
        "database.server.name": "order_service",
        "table.include.list": "public.outbox_events",
        "tombstones.on.delete": "false",
        "transforms": "outbox",
        "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
        "transforms.outbox.table.fields.additional.placement": "type:header:eventType",
        "transforms.outbox.route.topic.replacement": "${routedByValue}",
        "transforms.outbox.route.by.field": "topic",
        "transforms.outbox.event.key": "aggregate_id",
        "transforms.outbox.event.payload": "payload"
      }
    }
