apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-system
  namespace: shop-system
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service-pdb
  namespace: shop-system
  labels:
    app: order-service
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: order-service
---
