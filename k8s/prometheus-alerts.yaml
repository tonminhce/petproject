apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-system-alerts
  namespace: shop-system
  labels:
    role: alert-rules
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  groups:
    - name: shop.ecommerce.rules
      rules:
        - alert: ServiceDown
          expr: up{job="petproject-services"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Service instance down: {{ $labels.instance }}"
            description: "Instance {{ $labels.instance }} of job {{ $labels.job }} has been unreachable for more than 1 minute."

        - alert: HighHttp5xxRate
          expr: (sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum by (application) (rate(http_server_requests_seconds_count[5m])), 0.001)) > 0.01
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "High HTTP 5xx error rate on {{ $labels.application }}"
            description: "5xx error rate on service {{ $labels.application }} exceeds 1% over the last 5 minutes."

        - alert: HighJvmHeapUsage
          expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85) and (jvm_memory_max_bytes{area="heap"} > 0)
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "JVM Heap usage > 85% on {{ $labels.application }}"
            description: "JVM heap usage on {{ $labels.application }} ({{ $labels.instance }}) exceeds 85% for more than 3 minutes."

        - alert: HighOutboxPendingLag
          expr: max by (application) ({__name__=~".*_outbox_pending_count"}) > 1000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Outbox pending lag is high on {{ $labels.application }}"
            description: "Application {{ $labels.application }} has more than 1000 pending outbox events awaiting relay."

        - alert: HighHikariPoolSaturation
          expr: (hikaricp_connections_active / hikaricp_connections_max > 0.90) and (hikaricp_connections_max > 0)
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "HikariCP pool saturation on {{ $labels.application }}"
            description: "Hikari connection pool usage on {{ $labels.application }} ({{ $labels.instance }}) exceeds 90% capacity."
