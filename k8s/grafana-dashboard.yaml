apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-system-grafana-dashboards
  namespace: shop-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: ecommerce-platform
data:
  shop-system-overview.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "HTTP Request Rate (RPS)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum by (job) (rate(http_server_requests_seconds_count{namespace=\"shop-system\"}[1m]))",
              "legendFormat": "{{ job }}"
            }
          ]
        },
        {
          "title": "HTTP 5xx Error Rate (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "(sum by (job) (rate(http_server_requests_seconds_count{status=~\"5..\", namespace=\"shop-system\"}[1m])) / sum by (job) (rate(http_server_requests_seconds_count{namespace=\"shop-system\"}[1m]))) * 100",
              "legendFormat": "{{ job }} 5xx %"
            }
          ]
        },
        {
          "title": "HTTP Latency P95 (seconds)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, job) (rate(http_server_requests_seconds_bucket{namespace=\"shop-system\"}[5m])))",
              "legendFormat": "{{ job }} p95"
            }
          ]
        },
        {
          "title": "JVM Heap Usage (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "(jvm_memory_used_bytes{area=\"heap\", namespace=\"shop-system\"} / jvm_memory_max_bytes{area=\"heap\", namespace=\"shop-system\"}) * 100",
              "legendFormat": "{{ pod }} Heap %"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["ecommerce", "shop-system"],
      "time": { "from": "now-1h", "to": "now" },
      "title": "Shop Microservices System Overview",
      "version": 1
    }
