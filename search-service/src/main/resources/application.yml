spring:
  application:
    name: search-service

server:
  port: ${SERVER_PORT:8094}

elasticsearch:
  url: ${ELASTICSEARCH_URL:http://localhost:9200}
  username: ${ES_ADMIN_USERNAME:}
  password: ${ES_ADMIN_PASSWORD:}

shop:
  kafka:
    bootstrap-servers: ${SHOP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: search-service
      auto-offset-reset: latest

  services:
    product:
      url: ${PRODUCT_SERVICE_URL:http://localhost:8086}
      timeout-ms: 3000
    keycloak:
      token-url: ${KEYCLOAK_TOKEN_URL:http://localhost:8080/realms/ecommerce/protocol/openid-connect/token}
      client-id: ${SEARCH_SERVICE_CLIENT_ID:search-service}
      client-secret: ${SEARCH_SERVICE_CLIENT_SECRET:changeme}

  security:
    issuer-uri: ${SHOP_SECURITY_ISSUER_URI:http://localhost:9090/realms/ecommerce}
    csrf-disabled: true
    stateless-session: true
    public-paths: []
