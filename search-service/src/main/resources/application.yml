spring:
  application:
    name: search-service

server:
  port: ${SERVER_PORT:8094}

elasticsearch:
  url: ${ELASTICSEARCH_URL:http://localhost:9200}
  username: ${ELASTICSEARCH_USERNAME:}
  password: ${ELASTICSEARCH_PASSWORD:}

shop:
  kafka:
    bootstrap-servers: ${SHOP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: search-service
      auto-offset-reset: latest

  security:
    issuer-uri: ${SHOP_SECURITY_ISSUER_URI:http://localhost:9090/realms/ecommerce}
    csrf-disabled: true
    stateless-session: true
    public-paths: []
