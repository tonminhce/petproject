databaseChangeLog:
  - changeSet:
      id: 006-create-product-variants
      author: shop-platform
      changes:
        - createTable:
            tableName: product_variants
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_variant_product
                    references: products(id)
              - column:
                  name: sku
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: "numeric(15,2)"
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: attributes
                  type: varchar(1000)
              - column:
                  name: image_url
                  type: varchar(500)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(100)
              - column:
                  name: updated_by
                  type: varchar(100)
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamp
              - column:
                  name: deleted_by
                  type: varchar(255)

        - createIndex:
            tableName: product_variants
            indexName: idx_product_variants_product_id
            columns:
              - column:
                  name: product_id

        - sql:
            sql: >-
              CREATE UNIQUE INDEX idx_product_variants_sku_unique_active
              ON product_variants (sku) WHERE deleted = false
