spring:
  application:
    name: product-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/productservice}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  cache:
    type: redis
    redis:
      time-to-live: 600000          # 10 min
      cache-null-values: false
      use-key-prefix: true

server:
  port: ${SERVER_PORT:8086}

shop:
  kafka:
    bootstrap-servers: ${SHOP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
    consumer:
      group-id: product-service
      auto-offset-reset: earliest
  security:
    public-paths:
      - method: GET
        path: /api/v1/products/**
      - method: GET
        path: /api/v1/categories/**
      - method: GET
        path: /api/v1/brands/**
  media:
    base-url: ${MEDIA_SERVICE_URL:http://media-service:8083}
    timeout-ms: 3000
    keycloak:
      token-url: ${KEYCLOAK_TOKEN_URL:http://localhost:8080/realms/ecommerce/protocol/openid-connect/token}
      client-id: ${PRODUCT_SERVICE_CLIENT_ID:product-service}
      client-secret: ${PRODUCT_SERVICE_CLIENT_SECRET:}

  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://inventory-service:8082}
    timeout-ms: 3000

  product:
    media-sweep:
      enabled: ${SHOP_PRODUCT_MEDIA_SWEEP_ENABLED:true}
      cron: ${SHOP_PRODUCT_MEDIA_SWEEP_CRON:0 */30 * * * *}
      limit: ${SHOP_PRODUCT_MEDIA_SWEEP_LIMIT:100}

product:
  outbox:
    poll-interval-ms: 5000
    batch-size: 100
    max-retries: 10
