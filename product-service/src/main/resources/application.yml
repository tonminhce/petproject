# =============================================================================
#  product-service — Product catalog (products, categories, brands).
#  Reads/writes Postgres, caches hot reads in Redis, and publishes lifecycle
#  events to Kafka through a transactional outbox.
#
#  Platform-wide defaults live in `common-spring/application.yml` (inherited).
#  Only service-specific overrides belong here.
# =============================================================================
spring:
  application:
    name: product-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/productservice}
    # docker-compose injects POSTGRES_USER / POSTGRES_PASSWORD via the pg-creds anchor.
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema is owned by Liquibase — never let Hibernate mutate it.
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Empty means "no AUTH" — the compose Redis runs with --requirepass.
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  cache:
    type: redis
    redis:
      # Fallback TTL for caches not listed in CacheConfig (600000 ms = 10 minutes).
      time-to-live: 600000
      cache-null-values: false
      use-key-prefix: true

server:
  # Override the common-spring default 8080 (compose maps 8086:8086).
  port: ${SERVER_PORT:8086}

shop:
  kafka:
    # common-kafka binds `shop.kafka.*` (KafkaProperties) — NOT `spring.kafka.*`.
    bootstrap-servers: ${SHOP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Durability over throughput: the outbox relay must not lose events.
      acks: all
      retries: 3
  security:
    # Catalog reads are anonymous; writes stay authenticated.
    # (actuator, swagger, api-docs are public via common-security platform defaults)
    public-paths:
      - method: GET
        path: /api/v1/products/**
      - method: GET
        path: /api/v1/categories/**
      - method: GET
        path: /api/v1/brands/**

product:
  outbox:
    poll-interval-ms: 5000
    batch-size: 100
    max-retries: 10
