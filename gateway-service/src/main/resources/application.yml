server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: gateway-service
  main:
    banner-mode: off
  jackson:
    default-property-inclusion: non_null
  codec:
    max-in-memory-size: 2MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://keycloak:8080/realms/ecommerce}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

shop:
  security:
    # No-op at runtime for gateway-service: SecurityAutoConfiguration is
    # servlet-only (gateway uses Spring Cloud Gateway WebFlux). Documented
    # here for canonical EndpointRule shape — future servlet-mode migration.
    public-paths:
      - path: /api/v1/auth/**

gateway:
  keycloak-issuer-uri: ${JWT_ISSUER_URI:http://keycloak:8080/realms/ecommerce}
  cors-allowed-origin-patterns:
    - ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    replenish-rate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:100}
    burst-capacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:200}
    requested-tokens: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}
    # Set only when a trusted reverse proxy is in front of the gateway.
    trusted-proxy-hops: ${GATEWAY_RATE_LIMIT_TRUSTED_PROXY_HOPS:0}
    global:
      enabled: ${GATEWAY_GLOBAL_RATE_LIMIT_ENABLED:true}
      replenish-rate: ${GATEWAY_GLOBAL_RATE_LIMIT_REPLENISH_RATE:2000}
      burst-capacity: ${GATEWAY_GLOBAL_RATE_LIMIT_BURST_CAPACITY:4000}
      requested-tokens: ${GATEWAY_GLOBAL_RATE_LIMIT_REQUESTED_TOKENS:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.shop.gateway: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO
