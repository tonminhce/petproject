server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: none

spring:
  config:
    import: "classpath:/application-shared.yml"
  application:
    name: gateway-service
  main:
    banner-mode: off
  jackson:
    default-property-inclusion: non_null
  codec:
    max-in-memory-size: 2MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://keycloak:8080/realms/ecommerce}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

shop:
  security:
    public-paths:
      - path: /api/v1/auth/**

gateway:
  keycloak-issuer-uri: ${JWT_ISSUER_URI:http://keycloak:8080/realms/ecommerce}
  security:
    expected-client-ids: ${GATEWAY_EXPECTED_CLIENT_IDS:ecommerce-client}
  cors-allowed-origin-patterns:
    - ${CORS_ALLOWED_ORIGIN_PATTERNS:?CORS_ALLOWED_ORIGIN_PATTERNS must be set explicitly}
  public-endpoints:
    - /actuator/health
    - /actuator/health/**
    - /actuator/info
    - /actuator/prometheus
    - /v3/api-docs/**
    - /swagger-ui/**
    - /webjars/**
    - /api/v1/auth/**
    - /api/v1/webhooks/payments/**
    - /api/v1/webhooks/shipping/**
    - /api/v1/products
    - /api/v1/products/**
    - /api/v1/categories
    - /api/v1/categories/**
    - /api/v1/brands
    - /api/v1/brands/**
    - /api/v1/search
    - /api/v1/search/**
    - /api/v1/ratings
    - /api/v1/ratings/**
    - /api/v1/medias
    - /api/v1/medias/**
    - /api/v1/carts
    - /api/v1/carts/**
    - /api/v1/orders/track
  trusted-proxy:
    cidrs: ${GATEWAY_TRUSTED_PROXY_CIDRS:}
    hops: ${GATEWAY_TRUSTED_PROXY_HOPS:0}
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    replenish-rate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:100}
    burst-capacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:200}
    requested-tokens: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}
    outage-policy: ${GATEWAY_RATE_LIMIT_OUTAGE_POLICY:FAIL_CLOSED}
    global:
      enabled: ${GATEWAY_GLOBAL_RATE_LIMIT_ENABLED:true}
      replenish-rate: ${GATEWAY_GLOBAL_RATE_LIMIT_REPLENISH_RATE:2000}
      burst-capacity: ${GATEWAY_GLOBAL_RATE_LIMIT_BURST_CAPACITY:4000}
      requested-tokens: ${GATEWAY_GLOBAL_RATE_LIMIT_REQUESTED_TOKENS:1}
      lanes: ${GATEWAY_GLOBAL_RATE_LIMIT_LANES:8}
      fair-share-clients: ${GATEWAY_GLOBAL_RATE_LIMIT_FAIR_SHARE_CLIENTS:20}
      replicas: ${GATEWAY_GLOBAL_RATE_LIMIT_REPLICAS:1}
  edge-rate-limit:
    enabled: ${GATEWAY_EDGE_RATE_LIMIT_ENABLED:true}
    backoffice-requests-per-minute: ${GATEWAY_EDGE_RATE_LIMIT_BACKOFFICE_RPM:10}
    search-requests-per-minute: ${GATEWAY_EDGE_RATE_LIMIT_SEARCH_RPM:60}
  pre-auth-rate-limit:
    enabled: ${GATEWAY_PRE_AUTH_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${GATEWAY_PRE_AUTH_RATE_LIMIT_RPM:3000}
  resilience:
    circuit-breaker:
      enabled: ${GATEWAY_CIRCUIT_BREAKER_ENABLED:true}
      failure-rate-threshold: ${GATEWAY_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
      sliding-window-size: ${GATEWAY_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:100}
      minimum-number-of-calls: ${GATEWAY_CIRCUIT_BREAKER_MINIMUM_NUMBER_OF_CALLS:20}
      wait-duration-in-open-state: ${GATEWAY_CIRCUIT_BREAKER_WAIT_DURATION_IN_OPEN_STATE:10s}
      permitted-calls-in-half-open-state: ${GATEWAY_CIRCUIT_BREAKER_PERMITTED_CALLS_IN_HALF_OPEN_STATE:5}
      slow-call-duration-threshold: ${GATEWAY_CIRCUIT_BREAKER_SLOW_CALL_DURATION_THRESHOLD:2s}
    bulkhead:
      enabled: ${GATEWAY_BULKHEAD_ENABLED:true}
      max-concurrent-calls: ${GATEWAY_BULKHEAD_MAX_CONCURRENT_CALLS:200}
  admin-ip-allowlist:
    cidrs: ${ADMIN_IP_ALLOWLIST:}
    required: ${GATEWAY_REQUIRE_ADMIN_IP_ALLOWLIST:false}
  route-targets:
    overrides: {}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.shop.gateway: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO
