databaseChangeLog:
  - changeSet:
      id: 002b-expand-events-status-check-pre
      author: shop-platform
      changes:
        - sql:
            sql: >-
              ALTER TABLE shipment_events DROP CONSTRAINT IF EXISTS ck_shipment_events_status;
              ALTER TABLE shipment_events
              ADD CONSTRAINT ck_shipment_events_status
              CHECK (status IN ('PROCESSED', 'FAILED', 'FAILED_RETRYABLE', 'FAILED_PERMANENT'))
