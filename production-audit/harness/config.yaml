# Harness configuration
root: ..                       # repository root (relative to harness/)
audit_dir: ../production-audit  # audit artifact root
maven:
  wrapper: mvnw.cmd
  args: ["-B", "-ntp"]
  skip_flags: ["-Dcheckstyle.skip=true", "-Djib.skip=true"]
modules:
  services:
    - auth-service
    - product-service
    - order-service
    - payment-service
    - inventory-service
    - shipping-service
    - notification-service
    - rating-service
    - search-service
    - promotion-service
    - tax-service
    - favourite-service
    - media-service
    - gateway-service
  shared:
    - utils/common-core
    - utils/common-spring
    - utils/common-security
    - utils/common-logging
    - utils/common-keycloak
    - utils/common-kafka
    - utils/common-storage
suites:
  - source
  - build
  - unit
  - security
  - kafka
  - database
  - performance
  - checkout
  - contracts
  - recovery
  - e2e
coverage:
  review_levels: [DISCOVERED, ASSIGNED, FULLY_READ, SEMANTICALLY_REVIEWED, DEEP_TRACED, CROSS_REVIEWED, RUNTIME_VERIFIED]
  require_line_coverage: true
regression_triggers:
  - utils/common-core
  - utils/common-spring
  - utils/common-security
  - utils/common-kafka
  - utils/common-storage
  - order-service
  - payment-service
  - inventory-service
  - gateway-service
