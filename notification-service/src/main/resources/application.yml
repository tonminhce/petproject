spring:
  application:
    name: notification-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notificationservice}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8090}

shop:
  kafka:
    bootstrap-servers: ${SHOP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: latest

  notification:
    smtp:
      enabled: ${SMTP_ENABLED:false}
      fallback-recipient: ${SMTP_FALLBACK_RECIPIENT:ops@example.com}
    retry:
      poll-ms: ${NOTIFICATION_RETRY_POLL_MS:60000}
      initial-delay-ms: ${NOTIFICATION_RETRY_INITIAL_DELAY_MS:0}
      batch-size: ${NOTIFICATION_RETRY_BATCH_SIZE:50}
      max-attempts: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:6}
      backoff-base-seconds: ${NOTIFICATION_RETRY_BACKOFF_BASE_SECONDS:300}
      stale-sending-seconds: ${NOTIFICATION_RETRY_STALE_SENDING_SECONDS:900}

  security:
    issuer-uri: ${SHOP_SECURITY_ISSUER_URI:http://localhost:9090/realms/ecommerce}
    csrf-disabled: true
    stateless-session: true
