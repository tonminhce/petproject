spring:
  application:
    name: media-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mediaservice}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8083}

shop:
  kafka:
    bootstrap-servers: ${SHOP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: media-service
      auto-offset-reset: latest

  # common-storage wires S3Client/S3Presigner/ObjectStorageService from these
  # props (RustFS in compose, MinIO in ITs). Bucket creation is BucketBootstrap's
  # job — it also asserts the private ACL — so auto-create stays off here and a
  # storage outage at startup degrades the service instead of killing the context.
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:rustfsadmin}
    secret-key: ${STORAGE_SECRET_KEY:rustfsadmin}
    bucket: ${STORAGE_BUCKET:media}
    auto-create-bucket: false

  security:
    issuer-uri: ${SHOP_SECURITY_ISSUER_URI:http://localhost:9090/realms/ecommerce}
    csrf-disabled: true
    stateless-session: true
    public-paths: []

  # D4 outbox relay scheduling (ports rating-service's convention)
  # H-5 aging: nightly retention — SENT>retention-days purged, FAILED>retention-days → terminal DEAD
  media:
    outbox:
      poll-millis: ${MEDIA_OUTBOX_POLL_MILLIS:2000}
      batch-size: 100
      max-retries: 10
      retention-days: ${MEDIA_OUTBOX_RETENTION_DAYS:7}
      retention-cron: ${MEDIA_OUTBOX_RETENTION_CRON:0 0 3 * * *}

  # H-4 purge gate: product-service internal reference-count endpoint
  # (SERVICE-token gated) + client_credentials token endpoint. Compose wiring
  # for these env vars rides the fleet env sweep.
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8086}
    timeout-ms: 3000
    keycloak:
      token-url: ${KEYCLOAK_TOKEN_URL:http://localhost:9090/realms/ecommerce/protocol/openid-connect/token}
      client-id: ${MEDIA_SERVICE_CLIENT_ID:media-service}
      client-secret: ${MEDIA_SERVICE_CLIENT_SECRET:changeme}

media:
  bucket: ${STORAGE_BUCKET:media}
  presign-ttl: ${MEDIA_PRESIGN_TTL:7d}
  max-upload: ${MEDIA_MAX_UPLOAD:10MB}
  purge-grace: ${MEDIA_PURGE_GRACE:30d}
  display-width: ${MEDIA_DISPLAY_WIDTH:1200}
  thumb-width: ${MEDIA_THUMB_WIDTH:320}
