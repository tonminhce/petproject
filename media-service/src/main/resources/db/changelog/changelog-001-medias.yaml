databaseChangeLog:

  - changeSet:
      id: 001-create-medias
      author: shop-platform
      changes:
        - createTable:
            tableName: medias
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column: { name: sha256,       type: varchar(64),    constraints: { nullable: false } }
              - column: { name: content_type, type: varchar(100),   constraints: { nullable: false } }
              - column: { name: size_bytes,   type: bigint,         constraints: { nullable: false } }
              - column: { name: deleted,      type: boolean,        constraints: { nullable: false }, defaultValueBoolean: false }
              - column: { name: deleted_at,   type: timestamptz }
              - column: { name: deleted_by,   type: varchar(255) }
              - column: { name: created_at,   type: timestamptz,    constraints: { nullable: false }, defaultValueComputed: "CURRENT_TIMESTAMP" }
              - column: { name: updated_at,   type: timestamptz,    constraints: { nullable: false }, defaultValueComputed: "CURRENT_TIMESTAMP" }
              - column: { name: created_by,   type: varchar(100) }
              - column: { name: updated_by,   type: varchar(100) }

  - changeSet:
      id: 001-medias-sha256-unique
      author: shop-platform
      changes:
        - sql: |
            CREATE UNIQUE INDEX uk_medias_sha256 ON medias (sha256);

  - changeSet:
      id: 001-create-media-variants
      author: shop-platform
      changes:
        - createTable:
            tableName: media_variants
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column: { name: media_id,   type: uuid,         constraints: { nullable: false } }
              - column: { name: variant,    type: varchar(20),  constraints: { nullable: false } }
              - column: { name: format,     type: varchar(10),  constraints: { nullable: false } }
              - column: { name: width,      type: integer,      constraints: { nullable: false } }
              - column: { name: bytes,      type: bigint,       constraints: { nullable: false } }
              - column: { name: object_key, type: varchar(500), constraints: { nullable: false } }

  - changeSet:
      id: 001-media-variants-constraints
      author: shop-platform
      changes:
        - sql: |
            ALTER TABLE media_variants ADD CONSTRAINT fk_media_variants_media FOREIGN KEY (media_id) REFERENCES medias (id) ON DELETE CASCADE;
            ALTER TABLE media_variants ADD CONSTRAINT ck_media_variants_variant CHECK (variant IN ('original', 'display', 'thumb'));
            ALTER TABLE media_variants ADD CONSTRAINT ck_media_variants_format CHECK (format IN ('jpeg', 'png', 'webp'));
            ALTER TABLE media_variants ADD CONSTRAINT ck_media_variants_width CHECK (width > 0);
            CREATE UNIQUE INDEX uk_media_variant_format ON media_variants (media_id, variant, format);
            CREATE INDEX idx_media_variants_media ON media_variants (media_id);
